name: Build VN-RP Alternative SA-MP 2.10

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-alt-210.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Clone alternative SA-MP 2.10 client
        run: git clone --depth 1 https://github.com/junior-dior/SA-MP-Mobile-Client-2.10-x64.git android-src

      - name: Patch VN-RP server and safe settings fallback
        working-directory: android-src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Send every server slot to VN-RP.
          p = Path('app/src/main/cpp/samp/servers.h')
          s = p.read_text(encoding='utf-8-sig')
          import re
          s = re.sub(r'#define SERVER_HOST_(?:[1-4]|TEST) "[^"]+"',
                     lambda m: m.group(0).split('"')[0] + '"14.186.26.111"', s)
          s = re.sub(r'#define SERVER_PORT_(?:[1-4]|TEST) \d+',
                     lambda m: m.group(0).split()[0] + ' ' + m.group(0).split()[1] + ' 7777', s)
          p.write_text(s, encoding='utf-8')

          # Do not hard-crash if SAMP/settings.ini is missing on first run.
          p = Path('app/src/main/cpp/samp/settings.cpp')
          s = p.read_text(encoding='utf-8-sig')
          old = '''\tif(reader.ParseError() < 0)
\t{
\t\tFLog("Error: can't load %s", buff);
\t\tstd::terminate();
\t\treturn;
\t}'''
          new = '''\tif(reader.ParseError() < 0)
\t{
\t\tFLog("Warning: can't load %s; using built-in defaults.", buff);
\t}'''
          if old not in s:
              raise SystemExit('settings.cpp fallback block not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # ARM64 only for the test APK.
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace("abiFilters 'armeabi-v7a', 'arm64-v8a'", "abiFilters 'arm64-v8a'")
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Build alternative APK
        working-directory: android-src
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VN-RP-SA-MP-2.10-ALT
          path: android-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
