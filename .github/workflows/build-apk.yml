name: Build GTA SA Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Clone upstream client
        run: git clone --depth 1 https://github.com/JohnPeriaX/samp-mobile-2.11.311.git android-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: android-src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-Mobile-debug
          path: android-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
