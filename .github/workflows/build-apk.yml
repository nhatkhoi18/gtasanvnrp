name: Build GTA SA Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Clone upstream client
        run: git clone --depth 1 https://github.com/JohnPeriaX/samp-mobile-2.11.311.git android-src

      - name: Apply VN-RP launcher patches
        run: |
          cp patches/HomeFragment.java android-src/app/src/main/java/com/kurdish/roleplay/launcher/HomeFragment.java
          cp patches/GameDataImporter.java android-src/app/src/main/java/com/kurdish/roleplay/launcher/util/GameDataImporter.java

      - name: Add Android document tree dependency
        working-directory: android-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          marker = "implementation 'androidx.appcompat:appcompat:1.6.1'"
          dep = "implementation 'androidx.documentfile:documentfile:1.0.1'"
          if dep not in s:
              s = s.replace(marker, marker + "\n    " + dep)
          p.write_text(s)
          PY

      - name: Patch VN-RP server defaults and native connection
        working-directory: android-src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Native settings defaults.
          p = Path('app/src/main/cpp/multiplayer/samp/Settings/Settings.cpp')
          s = p.read_text()
          s = s.replace('reader.Get("client", "host", "141.95.234.17")', 'reader.Get("client", "host", "14.186.26.111")')
          s = s.replace('reader.GetInteger("client", "port", 1417)', 'reader.GetInteger("client", "port", 7777)')
          p.write_text(s)

          # Native connection must use parsed settings, not the old hard-coded server.
          p = Path('app/src/main/cpp/multiplayer/samp/main.cpp')
          s = p.read_text()
          old = 'pNetGame = new CNetGame("gta-irz.com", 7777, "Luca_Runky", "");'
          new = 'pNetGame = new CNetGame(pSettings->Get().szHost, pSettings->Get().iPort, pSettings->Get().szNickName, pSettings->Get().szPassword);'
          if old not in s:
              raise SystemExit('Expected hard-coded CNetGame line not found')
          s = s.replace(old, new)
          p.write_text(s)

          # Java config fallback also targets VN-RP.
          p = Path('app/src/main/java/com/kurdish/roleplay/launcher/util/ConfigValidator.java')
          s = p.read_text()
          s = s.replace('host=127.0.0.1', 'host=14.186.26.111')
          s = s.replace('sb.append("port=7777\\n")', 'sb.append("port=7777\\n")')
          p.write_text(s)

          # Fix immediate Play crash: upstream marks the SurfaceView active BEFORE
          # InitEGLAndGLES2(), which prevents creation of the EGL window surface.
          p = Path('app/src/main/java/com/rockstargames/oswrapper/GameActivityBase.java')
          s = p.read_text()
          old = '''                GameThread.INSTANCE.cachedSurfaceHolder = holder;
                GameThread.INSTANCE.viewIsActive = true;

                // Dynamic Resolution Scaling for Speed
                if (GameThread.INSTANCE.fixedWidth > 0) {
                    holder.setFixedSize(GameThread.INSTANCE.fixedWidth, GameThread.INSTANCE.fixedHeight);
                }
                GameThread.INSTANCE.InitEGLAndGLES2(3);'''
          new = '''                GameThread.INSTANCE.cachedSurfaceHolder = holder;
                GameThread.INSTANCE.viewIsActive = false;

                // Dynamic Resolution Scaling for Speed
                if (GameThread.INSTANCE.fixedWidth > 0) {
                    holder.setFixedSize(GameThread.INSTANCE.fixedWidth, GameThread.INSTANCE.fixedHeight);
                }
                boolean eglReady = GameThread.INSTANCE.InitEGLAndGLES2(3);
                GameThread.INSTANCE.viewIsActive = eglReady;'''
          if old not in s:
              raise SystemExit('Expected GameActivityBase surfaceCreated block not found')
          s = s.replace(old, new)
          p.write_text(s)

          # Second guard: create/recreate the EGL window surface whenever it is absent,
          # instead of relying only on viewIsActive.
          p = Path('app/src/main/java/com/rockstargames/oswrapper/GameThread.java')
          s = p.read_text()
          old = '''            if (!this.viewIsActive) {
                System.out.println("Yes! Calling create surface");
                createEGLSurface(this.cachedSurfaceHolder);
                System.out.println("Done creating surface");
            }
            this.viewIsActive = true;
            this.SwapBufferSkip = 1;
            return true;'''
          new = '''            if (this.eglSurface == null) {
                if (this.cachedSurfaceHolder == null) {
                    System.out.println("Cannot create EGL surface: SurfaceHolder is null");
                    this.viewIsActive = false;
                    return false;
                }
                System.out.println("Creating EGL window surface");
                if (!createEGLSurface(this.cachedSurfaceHolder)) {
                    System.out.println("Failed creating EGL window surface");
                    this.viewIsActive = false;
                    return false;
                }
                System.out.println("Done creating EGL window surface");
            }
            this.viewIsActive = true;
            this.SwapBufferSkip = 1;
            return true;'''
          if old not in s:
              raise SystemExit('Expected GameThread EGL block not found')
          s = s.replace(old, new)

          old = '''        this.eglSurface = this.egl.eglCreateWindowSurface(this.eglDisplay, this.eglConfig, surfaceHolder, (int[]) null);
        Log.d("dfs", "eglCreateWindowSurface err: " + this.egl.eglGetError());'''
          new = '''        if (surfaceHolder == null || this.egl == null || this.eglDisplay == null || this.eglConfig == null) {
            Log.e("dfs", "createEGLSurface called without a valid holder/display/config");
            return false;
        }
        this.eglSurface = this.egl.eglCreateWindowSurface(this.eglDisplay, this.eglConfig, surfaceHolder, (int[]) null);
        int surfaceError = this.egl.eglGetError();
        Log.d("dfs", "eglCreateWindowSurface err: " + surfaceError);
        if (this.eglSurface == null || this.eglSurface == EGL10.EGL_NO_SURFACE || surfaceError != EGL10.EGL_SUCCESS) {
            Log.e("dfs", "eglCreateWindowSurface failed");
            this.eglSurface = null;
            return false;
        }'''
          if old not in s:
              raise SystemExit('Expected GameThread createEGLSurface block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Patch duplicate native libraries
        working-directory: android-src
        run: |
          rm -f app/src/main/jniLibs/arm64-v8a/libbass.so
          rm -f app/src/main/jniLibs/arm64-v8a/libbass_ssl.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        shell: bash
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: android-src
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VN-RP-Mobile-EGL-crash-fix
          path: android-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
