name: Build VN-RP SA-MP 2.10

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source
        run: git clone --depth 1 https://github.com/junior-dior/SA-MP-Mobile-Client-2.10-x64.git android-src

      - name: Set VN-RP server
        working-directory: android-src
        run: |
          sed -i 's/127.0.0.1/14.186.26.111/g' app/src/main/cpp/samp/servers.h
          sed -i 's#samp_widgets/playerTabList.h#samp_widgets/playertablist.h#g' app/src/main/cpp/samp/gui/gui.h
          sed -i 's/#include "RGBA.h"/#include "rgba.h"/' app/src/main/cpp/samp/game/rgba.cpp

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Build
        working-directory: android-src
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: VN-RP-SA-MP-2.10-ALT
          path: android-src/app/build/outputs/apk/debug/*.apk
